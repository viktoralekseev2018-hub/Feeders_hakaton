name: Host checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go build ./cmd/game-server
